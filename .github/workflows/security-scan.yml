name: Scheduled Security Scan

# New advisories appear without any change to this repository, so the
# dependency graph is rescanned weekly: govulncheck for every Go module on
# each supported Go release, and pip-audit for the documentation toolchain.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Go Releases
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.matrix.outputs.go }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Go matrix
        id: matrix
        run: echo "go=$(scripts/go-matrix.sh)" >> "$GITHUB_OUTPUT"

  govulncheck:
    name: govulncheck (Go ${{ matrix.go }})
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(needs.inventory.outputs.go) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            */go.sum

      - name: Scan every module
        run: make vulncheck

  pip-audit:
    name: pip-audit (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Audit documentation requirements
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1
        with:
          inputs: docs/requirements.txt
