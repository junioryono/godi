version: "2"
run:
  # Language version only; the CI toolchain is pinned in .go-version.
  go: "1.26"
linters:
  enable:
    - copyloopvar
    - errname
    - gocritic
    - gocyclo
    - gomodguard_v2
  # Considered but not enabled yet, because they report findings in core
  # package files and internal/ that are being changed elsewhere:
  #   - errorlint: errors.go and internal/reflection compare and type-assert
  #     errors directly (== ErrServiceNotFound, err.(*ResolutionError)).
  #   - funlen (100 lines / 50 statements): collection.go doBuild and
  #     descriptor.go newDescriptorWithAnalyzer exceed the limits.
  # Enable them once those call sites use errors.Is/errors.As and the long
  # functions are split.
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 30
    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - errors
            - fmt
          reason: use standard library errors package
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocyclo
        path: _test\.go
      - linters:
          - unused
        path: vendor/
      - linters:
          - unused
        text: is unused
        source: ^\s*\w+\s+interface\s*{
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
